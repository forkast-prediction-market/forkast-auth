minimumReleaseAge: 1440
shellEmulator: true
trustPolicy: no-downgrade
trustPolicyExclude:
  # slow-redact is pinned through pino -> @walletconnect/logger.
  - slow-redact@0.3.2
  - nanoid@3.3.14
blockExoticSubdeps: true
allowBuilds:
  '@reown/appkit': false
  bufferutil: false
  esbuild: true
  keccak: false
  sharp: false
  utf-8-validate: false
  workerd: false

overrides:
  axios: 1.19.0
  uuid: 11.1.1
  ws: 8.21.0
  '@walletconnect/relay-auth>@noble/curves': 1.8.1
  '@walletconnect/relay-auth>@noble/hashes': 1.7.1
  vite: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.8
  vite-plus: 0.2.9
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - oxlint
  - '@oxlint/*'
  - oxlint-tsgolint
  - '@oxlint-tsgolint/*'
  - oxfmt
  - '@oxfmt/*'
  - vitest
  - '@vitest/*'
